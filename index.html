<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="screen-orientation" content="landscape">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Shadow Tagger — a 2D stealth platformer where you sneak past cops and paint graffiti murals on city walls. Hide in shadows, climb ladders, collect spray cans and tag the town!">
  <meta name="author" content="Shadow Tagger">

  <!-- Open Graph (Facebook, Discord, Messenger, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shadow Tagger — Stealth Graffiti Game">
  <meta property="og:description" content="Sneak past cops, hide in shadows and paint graffiti murals in this 2D stealth platformer. Collect spray cans, climb walls and tag the city!">
  <meta property="og:image" content="/assets/sprites/icon.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shadow Tagger — Stealth Graffiti Game">
  <meta name="twitter:description" content="Sneak past cops, hide in shadows and paint graffiti murals in this 2D stealth platformer.">
  <meta name="twitter:image" content="/assets/sprites/icon.png">

  <link rel="icon" type="image/png" href="/assets/sprites/icon.png">
  <link rel="apple-touch-icon" href="/assets/sprites/icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Shadow Tagger — Stealth Graffiti Game</title>
  <style>
    @font-face {
      font-family: 'Bungee';
      src: url('/assets/sprites/elementy/Bungee-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /*
     * SIZING PRIORITY — one source of truth:
     *   1. html/body        → locked to the viewport, no scroll
     *   2. #game-container  → fills the viewport (100vw × 100dvh)
     *   3. Phaser (RESIZE)  → canvas matches #game-container exactly
     *   4. Scenes           → read this.scale.width/height dynamically
     * No flexbox centering anywhere in the chain so nothing can shrink,
     * offset or letterbox the canvas. On mobile the game fills the full
     * screen; on large desktops a media query below shrinks the container
     * into a 16:9 framed window.
     */
    html, body {
      background: #0a0a0a;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    /* Desktop: contained 16:9 window, not full screen */
    @media (pointer: fine) and (min-width: 1024px) {
      #game-container {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(85vw, calc(85vh * 16 / 9));
        height: min(85vh, calc(85vw * 9 / 16));
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.08), 0 0 80px rgba(0, 0, 0, 0.6);
      }
    }
    canvas {
      display: block;
      /* Phaser's RESIZE scaler sets canvas.style.width/height to match
         the parent — no CSS overrides needed. */
    }

    /* "Rotate your phone" overlay — visible only in portrait on touch devices */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0a1a;
      color: #00ff88;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Bungee', monospace;
      text-align: center;
      gap: 20px;
    }
    #rotate-overlay .phone-icon {
      font-size: 64px;
      animation: rotate-hint 1.5s ease-in-out infinite;
    }
    #rotate-overlay p {
      font-size: 18px;
    }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="phone-icon">&#128241;</div>
    <p id="rotate-primary">Obróć telefon do pozycji poziomej</p>
    <p id="rotate-secondary" style="font-size: 12px; color: #445566;">Rotate your phone to landscape</p>
  </div>
  <script>
    (function() {
      var lang = (localStorage.getItem('st_lang') || navigator.language || 'en').slice(0, 2);
      if (lang !== 'pl') {
        var p = document.getElementById('rotate-primary');
        if (p) p.textContent = 'Rotate your phone to landscape';
        var s = document.getElementById('rotate-secondary');
        if (s) s.textContent = '';
      }
    })();
  </script>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
